name: Release

on:
  push:
    tags:
      - "*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build and package
        shell: bash
        run: |
          set -euo pipefail

          package_name="gamewrap-${GITHUB_REF_NAME}-linux-amd64"
          package_dir="artifacts/${package_name}"
          archive_name="${package_name}.tar.gz"

          mkdir -p "${package_dir}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build \
            -trimpath \
            -ldflags="-s -w" \
            -o "${package_dir}/gamewrap" \
            ./cmd/gamewrap

          actual_version="$("${package_dir}/gamewrap" --version)"
          expected_version="gamewrap ${GITHUB_REF_NAME}"
          if [[ "${actual_version}" != "${expected_version}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' does not match binary version '${actual_version}'." >&2
            exit 1
          fi

          cp -R dist/profiles "${package_dir}/profiles"
          cp README.md LICENSE "${package_dir}/"
          tar -C artifacts -czf "artifacts/${archive_name}" "${package_name}"
          cd artifacts
          sha256sum "${archive_name}" > "${archive_name}.sha256"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.tar.gz \
            artifacts/*.sha256 \
            --verify-tag \
            --generate-notes \
            --title "${GITHUB_REF_NAME}"
